name: Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ${{ secrets.BACKEND_PATH }}
            cd ${{ secrets.BACKEND_PATH }}

            # ── 1. Init git if not already (works on empty dir, non-empty dir,
            #       and re-runs — avoids "clone into non-empty dir" failure) ──
            if [ ! -d ".git" ]; then
              git init
              git remote add origin git@github.com:dghumman02/codezy_backend.git
            fi

            # ── 2. Sync server to exact state of master ──────────────────────
            git fetch origin master
            git reset --hard FETCH_HEAD

            # ── 3. Install production dependencies ───────────────────────────
            npm install --omit=dev

            # ── 4. Start or reload PM2 ───────────────────────────────────────
            if pm2 list | grep -q "codezy-backend"; then
              pm2 reload codezy-backend --update-env
            else
              pm2 start server.js --name codezy-backend
            fi

            pm2 save
